[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcomdtgen"
version = "0.1.0"
description = "Generate LineageOS device trees from a Qualcomm Android dump"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sigmund05" }]
keywords = ["android", "lineageos", "device-tree", "qualcomm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qcomdtgen = "qcomdtgen.cli:main"

[project.urls]
Homepage = "https://github.com/Sigmund05/android_device_tree_generator"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qcomdtgen = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
